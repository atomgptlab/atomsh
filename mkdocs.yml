site_name: Atomsh
site_url: https://atomgptlab.github.io/atomsh
site_description: Atomsh, your autonomous coding agent for science. A terminal coding agent powered by AtomGPT.
site_author: Kamal Choudhary
repo_url: https://github.com/atomgptlab/atomsh
repo_name: atomgptlab/atomsh
edit_uri: edit/main/docs/

copyright: "&copy; 2026 AtomGPTLab, Johns Hopkins University"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Using Atomsh: usage.md
  - Tools: tools.md
  - Permissions: permissions.md
  - Configuration: configuration.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
