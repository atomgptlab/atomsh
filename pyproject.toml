[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atomsh"
version = "0.1.0"
description = "Your autonomous coding agent for science"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kamal Choudhary", email = "kchoudh2@jhu.edu" }]
keywords = ["agent", "cli", "coding-assistant", "atomgpt",
            "materials-science", "jarvis"]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://atomgpt.org"
Repository = "https://github.com/atomgptlab/atomsh"

[project.scripts]
atomsh = "atomsh.cli:main"

[tool.setuptools.packages.find]
include = ["atomsh*"]
