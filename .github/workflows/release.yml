name: release

# Tag a release and this publishes it:
#   git tag v2026.9.2 && git push origin v2026.9.2
#
# Publishing uses PyPI trusted publishing, so no API token is stored here.
# Configure it once at https://pypi.org/manage/project/atomsh/settings/publishing/
# with owner atomgptlab, repository atomsh, workflow release.yml,
# environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          echo "tag=$tag packaged=$version"
          [ "$tag" = "$version" ] || {
            echo "tag $tag does not match version $version in pyproject.toml"
            exit 1
          }

      - run: uv build
      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
