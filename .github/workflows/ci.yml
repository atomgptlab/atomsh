name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # No --system: setup-uv has already created and activated a venv, and the
      # runner's system Python is externally managed (PEP 668), so --system
      # makes uv ignore the venv and then refuse to touch /usr.
      - name: Install
        run: uv pip install -e .

      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import atomsh
          for m in pkgutil.iter_modules(atomsh.__path__):
              importlib.import_module(f"atomsh.{m.name}")
              print("ok", m.name)
          PY

      - name: CLI responds without credentials
        run: |
          atomsh --version
          atomsh --help > /dev/null

      - name: Offline behaviour is a clean error, not a traceback
        env:
          ATOMSH_API_BASE: http://127.0.0.1:1
          ATOMSH_API_KEY: sk-not-a-real-key
        run: |
          output="$(atomsh --no-materials "hello" 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -qi "traceback" && { echo "unhandled exception"; exit 1; }
          exit 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
