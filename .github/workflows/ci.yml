name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv pip install --system -e .

      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import atomsh
          for m in pkgutil.iter_modules(atomsh.__path__):
              importlib.import_module(f"atomsh.{m.name}")
              print("ok", m.name)
          PY

      - name: CLI responds without credentials
        run: |
          atomsh --version
          atomsh --help > /dev/null

      - name: Offline behaviour is a clean error, not a traceback
        env:
          ATOMSH_API_BASE: http://127.0.0.1:1
          ATOMSH_API_KEY: sk-not-a-real-key
        run: |
          output="$(atomsh --no-materials "hello" 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -qi "traceback" && { echo "unhandled exception"; exit 1; }
          exit 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
